name: Brew installs

# 每天从 Homebrew Analytics 拉取 jinqimu/tap/transend 的安装量，更新 README 顶部徽章数据
# （docs/brew-installs.json 是 shields.io endpoint 格式；README 用 endpoint 徽章读取它）。
# 第三方 tap 也有统计，但公开 API 只有整份 30d/90d/365d 大文件，Shields 的 dynamic/json
# 不支持过滤查询且响应过大会超时，所以这里定时拉取后落到仓库里。
on:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch install count from Homebrew Analytics
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          CASK = "jinqimu/tap/transend"
          URL = "https://formulae.brew.sh/api/analytics/cask-install/365d.json"

          with urllib.request.urlopen(URL, timeout=60) as resp:
              data = json.load(resp)
          count = sum(int(item["count"]) for item in data["items"] if item.get("cask") == CASK)

          payload = {
              "schemaVersion": 1,
              "label": "brew 安装量（近一年）",
              "message": f"{count:,}",
              "color": "blue",
          }
          with open("docs/brew-installs.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"{CASK} 近一年安装量: {count}")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/brew-installs.json; then
            echo "安装量无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/brew-installs.json
          git commit -m "chore: 更新 Homebrew 安装量徽章"
          git push
