name: Release

# 推送 v* tag 时构建并发布：dmg（Homebrew 安装用）+ zip（应用内自更新用）+ 校验和。
# 本地打 tag：./Scripts/release.sh <version>
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (latest llama.cpp + swift release)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: RELEASE=1 ./Scripts/build-app.sh

      - name: Package dmg & zip
        run: |
          ./Scripts/make-dmg.sh
          ./Scripts/distribute.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Transend-*.dmg Transend-*.zip > checksums.txt
          cat checksums.txt

      - name: Extract release notes from README
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          awk -v v="**${version}**" '
            index($0, v) == 1 { capture=1 }
            capture && index($0, "**") == 1 && index($0, v) != 1 { exit }
            capture { print }
          ' README.md > release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets="dist/Transend-*.dmg dist/Transend-*.zip dist/checksums.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber
            [ -s release_notes.md ] && gh release edit "$tag" --notes-file release_notes.md || true
          elif [ -s release_notes.md ]; then
            gh release create "$tag" $assets --title "$tag" --notes-file release_notes.md
          else
            gh release create "$tag" $assets --title "$tag" --generate-notes
          fi
